name: Auto Sign

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai（北京时间每天 08:00 自动签到）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN: ${{ secrets.NTE_TOKEN }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}   # Server酱 Turbo SendKey，结果推到微信（和库街区用同一个 SCT... key，但本仓库要单独建一次 Secret）
      EXIT_WHEN_FAIL: on
      NO_PAUSE: "1"
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check token secret
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then
            echo "NTE_TOKEN secret is not configured."
            echo "Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run auto sign
        run: python nte.py 2>&1 | tee sign.log

      - name: Push result to WeChat (Server酱)
        if: always()
        run: python push_serverchan.py
